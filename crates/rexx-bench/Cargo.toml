[package]
name = "rexx-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rexx-lexer    = { path = "../rexx-lexer" }
rexx-parser   = { path = "../rexx-parser" }
rexx-formatter = { path = "../rexx-formatter" }
rexx-analyzer = { path = "../rexx-analyzer" }
rexx-walker   = { path = "../rexx-walker" }
criterion     = { version = "0.5", features = ["html_reports"] }
rayon.workspace = true
tempfile.workspace = true

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "lint"
harness = false

[[bench]]
name = "walker"
harness = false

[[bench]]
name = "multi_file"
harness = false
