name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Check (fmt + clippy + test in one runner) ─────────────────────────────────
# Compilation happens once. fmt/clippy/test share the same target/ directory,
# so only the first cargo invocation compiles from scratch.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

# ── Portable C ────────────────────────────────────────────────────────────────
  portable:
    name: Portable C
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build and test portable-c
        run: make portable-all

# ── Benchmarks (non-blocking) ─────────────────────────────────────────────────
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          save-if: false          # читаємо кеш із check, не перезаписуємо
      - name: Verify benchmarks compile
        run: cargo bench -p rexx-bench --no-run

# ── SARIF Validation ──────────────────────────────────────────────────────────
  sarif-validate:
    name: SARIF Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          save-if: false          # debug binary вже в кеші після check

      - name: Build CLI
        run: cargo build -p rexx-cli

      - name: Generate SARIF from sample Rexx file
        run: |
          mkdir -p /tmp/sarif-test
          printf 'say "missing header"\n' > /tmp/sarif-test/sample.rexx
          ./target/debug/rexxlint check --output sarif /tmp/sarif-test > /tmp/rexxlint.sarif || [ $? -eq 1 ]

      - name: Validate SARIF envelope
        run: |
          jq -e '
            .version == "2.1.0" and
            ((.runs | length) > 0) and
            (.runs[0].tool.driver.name | type) == "string" and
            (.runs[0].results | type) == "array"
          ' /tmp/rexxlint.sarif

# ── Package CLI artifact (CI smoke) ───────────────────────────────────────────
  package:
    name: Package CLI (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check, portable]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          save-if: false          # release profile — окремий кеш не потрібен

      - name: Build release binary
        run: cargo build --release -p rexx-cli

      - name: Assemble artifact
        run: |
          mkdir -p dist
          cp LICENSE README.md target/release/rexxlint dist/
          tar -czf dist/rexxlint-linux-x86_64.tar.gz \
            -C dist rexxlint LICENSE README.md

      - uses: actions/upload-artifact@v6
        with:
          name: rexxlint-linux-x86_64-ci
          path: dist/rexxlint-linux-x86_64.tar.gz
          retention-days: 7
          if-no-files-found: error
