name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
# ── Build release binaries ────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rexxlint-linux-x86_64.tar.gz
            bin: rexxlint

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: rexxlint-linux-aarch64.tar.gz
            bin: rexxlint
            apt_linker: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: rexxlint-macos-x86_64.tar.gz
            bin: rexxlint

          - os: macos-14
            target: aarch64-apple-darwin
            artifact: rexxlint-macos-aarch64.tar.gz
            bin: rexxlint

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rexxlint-windows-x86_64.zip
            bin: rexxlint.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation linker (aarch64-linux only)
        if: matrix.apt_linker != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt_linker }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p rexx-cli --target ${{ matrix.target }}

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp LICENSE README.md "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          tar -czf "dist/${{ matrix.artifact }}" \
            -C dist "${{ matrix.bin }}" LICENSE README.md

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory dist | Out-Null
          Copy-Item LICENSE, README.md dist/
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          Compress-Archive `
            -Path dist/${{ matrix.bin }}, dist/LICENSE, dist/README.md `
            -DestinationPath "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 90
          if-no-files-found: error

# ── Publish GitHub Release ────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip 2>/dev/null | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: rexxlint ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
