[workspace]
members = [
  "crates/rexx-ast",
  "crates/rexx-diagnostics",
  "crates/rexx-analyzer",
  "crates/rexx-formatter",
  "crates/rexx-cli",
  "crates/rexx-config",
  "crates/rexx-lexer",
  "crates/rexx-parser",
  "crates/rexx-rules",
  "crates/rexx-lsp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
